# Smart Syrian Transit on the ysman server. Lives in /srv/apps/syrian-transit (visible in Dockge).
# Reached through the existing Caddy container on the shared "web" network:
#   https://ysman.dyndns.info/transit/        rider app
#   https://ysman.dyndns.info/transit-admin/  admin console
#   https://ysman.dyndns.info/transit/api/... API (Caddy strips the /transit prefix)
# Secrets come from the .env file next to this file; they are never baked into the image.
# The web builds in ./web are produced on a workstation by deploy/ysman/deploy.sh.
services:
  syrian-transit-api:
    build: ./backend
    image: syrian-transit-api:latest
    container_name: syrian-transit-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8080
      # Heap is a share of the container limit below, so the API stays a good neighbour.
      - JAVA_OPTS=-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1
    mem_limit: 1g
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  syrian-transit-web:
    image: nginx:1.29-alpine
    container_name: syrian-transit-web
    restart: unless-stopped
    volumes:
      - ./web/rider:/usr/share/nginx/html/transit:ro
      - ./web/admin:/usr/share/nginx/html/transit-admin:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  web:
    external: true
