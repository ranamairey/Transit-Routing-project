# Serves the two single-page apps under their sub-paths; Caddy terminates TLS in front of this.
server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed build assets never change, so browsers may keep them.
    location ~ ^/(transit|transit-admin)/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and app shell must always be revalidated so updates reach riders.
    location ~ ^/transit/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /transit/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /transit/index.html;
    }

    location /transit-admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /transit-admin/index.html;
    }
}
