# Three containers: API, rider web app, admin console. MongoDB is Atlas (MONGO_URI in .env).
# HTTPS: enable the "tls" profile (Caddy obtains Let's Encrypt certificates for the domains in deploy/Caddyfile).
services:
  backend:
    build: .
    env_file: .env
    # MONGO_URI, JWT_SECRET and SEED_ADMIN_PASSWORD are mandatory and intentionally have no defaults.
    environment:
      MONGO_DB: ${MONGO_DB:-syrian_transit}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:8082}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      OSRM_URL: ${OSRM_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:8082}
    depends_on: [backend]
    ports:
      - "8081:80"
    restart: unless-stopped

  admin:
    build:
      context: ./admin-console
    depends_on: [backend]
    ports:
      - "8082:80"
    restart: unless-stopped

  # Pedestrian routing (optional): prepare the graph once with deploy/osrm/prepare.sh, then
  # docker compose --profile osrm up -d   and set OSRM_URL=http://osrm:5000 in .env
  osrm:
    image: osrm/osrm-backend:latest
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-table-size 500 /data/syria-latest.osrm
    volumes:
      - ./deploy/osrm/data:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    depends_on: [web, admin]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
