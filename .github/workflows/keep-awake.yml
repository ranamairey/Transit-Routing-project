name: Keep API awake

# Render's free plan sleeps after 15 minutes without traffic (about a minute to wake up).
# This pings the health endpoint every 10 minutes during the day in Damascus (05:00–24:00 UTC+3).
# Set the repository variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://syrian-transit-api.onrender.com — without it the job does nothing.
on:
  schedule:
    - cron: "*/10 2-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - run: curl -fsS -m 90 "${{ vars.BACKEND_URL }}/api/v1/health" || echo "API did not answer"
