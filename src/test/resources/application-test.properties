# Integration tests run against an embedded MongoDB (flapdoodle); no external database needed.
de.flapdoodle.mongodb.embedded.version=7.0.14
spring.data.mongodb.database=syrian_transit_test
app.seed.enabled=true
app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.transit.alert-window-hours=3
app.transit.auto-apply-threshold=3
logging.level.org.mongodb.driver=WARN
logging.level.de.flapdoodle=WARN
