spring.application.name=demo
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sprimg?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Transit Configuration
app.transit.max-ride-legs=3
app.transit.alternative-paths=3
app.transit.walk-radius-meters=750
app.transit.walk-speed-kmh=5
app.transit.servis-speed-kmh=22
app.transit.bus-speed-kmh=28
app.transit.peak-time-multiplier=1.4
app.transit.alert-window-hours=3
app.transit.auto-apply-threshold=3

# Security & Seeds
app.jwt.secret=${JWT_SECRET:mySuperSecretKey12345678901234567890}
app.jwt.expiration-ms=86400000
app.seed.admin-password=Admin#12345
app.seed.user-password=User#12345

# Anthropic AI Configuration
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:YOUR_ANTHROPIC_API_KEY_HERE}
spring.ai.anthropic.chat.options.model=claude-3-5-sonnet-20240620