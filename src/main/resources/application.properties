spring.application.name=transit-routing
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# NFR-1.1: small compressed payloads for weak networks
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=512

# MongoDB (set MONGO_URI / MONGO_DB in the environment or in .env, see README)
# Required: no default. The application refuses to start without MONGO_URI.
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB:syrian_transit}
spring.data.mongodb.auto-index-creation=true

# Transit / routing configuration
app.transit.max-ride-legs=3
app.transit.alternative-paths=3
app.transit.walk-radius-meters=750
app.transit.walk-speed-kmh=5
app.transit.servis-speed-kmh=22
app.transit.bus-speed-kmh=28
app.transit.peak-time-multiplier=1.4
app.transit.crowded-time-multiplier=1.5
app.transit.diverted-time-multiplier=1.3
app.transit.delayed-time-multiplier=1.25
# Peak windows in Asia/Damascus local time (HH:mm-HH:mm, comma separated)
app.transit.peak-windows=07:00-09:30,13:00-16:00
app.transit.alert-window-hours=3
app.transit.auto-apply-threshold=3
# Auto-applied route status returns to NORMAL after this many hours
app.transit.status-ttl-hours=6

# Security & seeds
# Required: no default. Use a long random string (32+ characters).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.seed.enabled=${SEED_ENABLED:true}
# damascus = bundled real network (src/main/resources/data/damascus-network.json); demo = small hand-made network
app.seed.dataset=${SEED_DATASET:damascus}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@demo.com}
# Required when seeding is enabled; no default. Demo rider accounts are only created when SEED_USER_PASSWORD is set.
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.user-password=${SEED_USER_PASSWORD:}

# CORS for the React app (comma separated origins)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Abuse limits (in-memory, per instance)
app.limits.login-attempts=10
app.limits.login-window-minutes=15
app.limits.report-cooldown-minutes=10
app.limits.reports-per-hour=20

# Walking routes through OSRM (foot profile). Empty = straight-line walking. See deploy/osrm/README.md
app.transit.osrm-url=${OSRM_URL:}
app.transit.osrm-profile=${OSRM_PROFILE:foot}
app.transit.osrm-timeout-ms=1500

# Account e-mails (password reset, verification). Set SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD to enable SMTP;
# without them the links are written to the server log.
app.mail.from=${MAIL_FROM:no-reply@transit.local}
app.public-url=${PUBLIC_URL:http://localhost:5173}
app.auth.require-verified-for-reports=${REQUIRE_VERIFIED_EMAIL:false}
